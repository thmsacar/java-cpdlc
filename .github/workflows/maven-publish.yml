name: Build and Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            pkg_type: exe
            icon_ext: ico
          - os: macos-latest
            pkg_type: dmg
            icon_ext: icns

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean package

    - name: Clean Extra Jars
      shell: bash
      run: |
        rm -f target/original-*.jar
        rm -f target/*-shaded.jar

    - name: Extract Version
      id: get_version
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
        else
          echo "VERSION=draft" >> $GITHUB_ENV
        fi

    - name: Pack Default Application with jpackage
      shell: bash
      run: |
        mkdir -p target/default_input
        cp target/java-cpdlc-${{ env.VERSION }}.jar target/default_input/ || cp target/java-cpdlc-*.jar target/default_input/
        rm -f target/default_input/*-legacy.jar
        DEFAULT_JAR=$(basename target/default_input/*.jar)
        EXTRA_OPTS=""
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          EXTRA_OPTS="--win-shortcut --win-menu --win-dir-chooser --win-menu-group JavaCPDLC"
        fi
        jpackage \
          --name "JavaCPDLC" \
          --input target/default_input/ \
          --main-jar "$DEFAULT_JAR" \
          --type ${{ matrix.pkg_type }} \
          --icon src/resources/icon.${{ matrix.icon_ext }} \
          --app-version ${{ env.VERSION == 'draft' && '1.0.0' || env.VERSION }} \
          $EXTRA_OPTS

    - name: Pack Legacy Application with jpackage
      shell: bash
      run: |
        mkdir -p target/legacy_input
        cp target/*-legacy.jar target/legacy_input/
        LEGACY_JAR=$(basename target/legacy_input/*-legacy.jar)
        EXTRA_OPTS=""
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          EXTRA_OPTS="--win-shortcut --win-menu --win-dir-chooser --win-menu-group JavaCPDLC"
        fi
        jpackage \
          --name "JavaCPDLC-Legacy" \
          --input target/legacy_input/ \
          --main-jar "$LEGACY_JAR" \
          --type ${{ matrix.pkg_type }} \
          --icon src/resources/icon.${{ matrix.icon_ext }} \
          --app-version ${{ env.VERSION == 'draft' && '1.0.0' || env.VERSION }} \
          $EXTRA_OPTS

    - name: Prepare JARs for Release
      shell: bash
      run: |
        DEFAULT_JAR_FILE=$(ls target/java-cpdlc-*.jar | grep -v 'legacy' | head -n 1)
        cp "$DEFAULT_JAR_FILE" JavaCPDLC-v${{ env.VERSION }}.jar
        cp target/*-legacy.jar JavaCPDLC-Legacy-v${{ env.VERSION }}.jar

    - name: Create or Update Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        body_path: RELEASE_NOTES.md
        files: |
          *.exe
          *.dmg
          *.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
